<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Revision Notes</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f7fb;
            color: #172033;
        }

        .container {
            width: 100%;
            max-width: 850px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            margin: 0 0 10px;
            font-size: 34px;
        }

        .header p {
            margin: 0;
            color: #667085;
            font-size: 16px;
        }

        .card {
            background: white;
            border-radius: 18px;
            padding: 28px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 15px;
        }

        input {
            width: 100%;
            padding: 14px 15px;
            border: 1px solid #d0d5dd;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
        }

        input:focus {
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.12);
        }

        button {
            width: 100%;
            margin-top: 15px;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #4f46e5;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        button:hover {
            background: #4338ca;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .message {
            display: none;
            margin-top: 18px;
            padding: 13px 15px;
            border-radius: 10px;
            font-size: 14px;
        }

        .error {
            display: block;
            background: #fef2f2;
            color: #b42318;
            border: 1px solid #fecdca;
        }

        .success {
            display: block;
            background: #ecfdf3;
            color: #027a48;
            border: 1px solid #abefc6;
        }

        .notes-card {
            display: none;
            margin-top: 25px;
            background: white;
            border-radius: 18px;
            padding: 30px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
        }

        .notes-card h2 {
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 25px;
        }

        .notes-content {
            white-space: pre-wrap;
            line-height: 1.7;
            font-size: 16px;
            color: #344054;
        }

        .print-button {
            margin-top: 25px;
            background: #111827;
        }

        .print-button:hover {
            background: #000000;
        }

        .loading {
            display: none;
            text-align: center;
            margin-top: 18px;
            color: #667085;
        }

        @media (max-width: 600px) {
            .container {
                padding: 25px 14px;
            }

            .card,
            .notes-card {
                padding: 20px;
            }

            .header h1 {
                font-size: 28px;
            }
        }

        @media print {
            body {
                background: white;
            }

            .header,
            .card,
            .print-button {
                display: none !important;
            }

            .container {
                max-width: none;
                padding: 0;
            }

            .notes-card {
                display: block !important;
                box-shadow: none;
                padding: 0;
                margin: 0;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>📚 My Revision Notes</h1>
        <p>Enter your phone number to view your latest revision notes.</p>
    </div>

    <div class="card">

        <form id="notesForm">

            <label for="phone">
                Phone Number
            </label>

            <input
                type="tel"
                id="phone"
                name="phone"
                placeholder="+91XXXXXXXXXX"
                autocomplete="tel"
                required
            >

            <button type="submit" id="submitButton">
                View My Notes
            </button>

        </form>

        <div id="loading" class="loading">
            Loading your notes...
        </div>

        <div id="message" class="message"></div>

    </div>

    <div id="notesCard" class="notes-card">

        <h2>📝 Your Revision Notes</h2>

        <div id="notesContent" class="notes-content"></div>

        <button
            type="button"
            class="print-button"
            onclick="window.print()"
        >
            🖨️ Print Notes
        </button>

    </div>

</div>

<script>
    const form = document.getElementById("notesForm");
    const phoneInput = document.getElementById("phone");
    const submitButton = document.getElementById("submitButton");

    const loading = document.getElementById("loading");
    const message = document.getElementById("message");

    const notesCard = document.getElementById("notesCard");
    const notesContent = document.getElementById("notesContent");


    function showMessage(text, type) {
        message.textContent = text;
        message.className = "message " + type;
    }


    function hideMessage() {
        message.textContent = "";
        message.className = "message";
    }


    function displayNotes(notes) {

        if (typeof notes === "string") {
            notesContent.textContent = notes;
            return;
        }

        if (notes && typeof notes === "object") {
            notesContent.textContent = JSON.stringify(notes, null, 2);
            return;
        }

        notesContent.textContent = "No notes available.";
    }


    form.addEventListener("submit", async function(event) {

        event.preventDefault();

        hideMessage();

        notesCard.style.display = "none";

        const phone = phoneInput.value.trim();

        if (!phone) {
            showMessage("Please enter your phone number.", "error");
            return;
        }

        submitButton.disabled = true;
        loading.style.display = "block";

        try {

            const response = await fetch(
                "/notes?phone=" + encodeURIComponent(phone)
            );

            const data = await response.json();

            if (!response.ok) {

                showMessage(
                    data.error || "No notes found for this phone number.",
                    "error"
                );

                return;
            }

            if (!data.notes) {

                showMessage(
                    "No revision notes found for this phone number.",
                    "error"
                );

                return;
            }

            displayNotes(data.notes);

            notesCard.style.display = "block";

            showMessage(
                "Your revision notes are ready!",
                "success"
            );

        } catch (error) {

            console.error(error);

            showMessage(
                "Something went wrong. Please try again.",
                "error"
            );

        } finally {

            submitButton.disabled = false;
            loading.style.display = "none";
        }

    });
</script>

</body>
</html>
